name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository; they never need to write to it.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle downloads between runs and verifies the checked-in wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      # The integration tests start PostgreSQL through Testcontainers.
      # Docker is preinstalled on GitHub's Ubuntu runners.
      - name: Run tests
        run: ./gradlew test

  frontend:
    name: Frontend typecheck, lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json records.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only checks that the Dockerfile still produces an image. Nothing is pushed anywhere.
      - name: Build the image
        run: docker build --tag flightfootprints:ci .
