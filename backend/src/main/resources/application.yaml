spring:
  application:
    name: flightfootprints

  config:
    # Development convenience: read ../.env (the git-ignored file in the repository root)
    # as extra properties. It is optional, and in production the same names arrive as
    # real environment variables, which always win over this file.
    import: optional:file:../.env[.properties]

  docker:
    compose:
      # compose.yaml lives in the repository root, one level above backend/.
      # Only read in development: the docker-compose module is not in the production jar.
      file: ../compose.yaml

  mvc:
    problemdetails:
      # Built-in Spring MVC errors (404, 405, validation, ...) are returned as
      # RFC 9457 application/problem+json instead of the default error page.
      enabled: true

server:
  servlet:
    session:
      # How long a signed-in session survives without any request.
      timeout: 8h
      # Keep the session id in the cookie only, never in a URL.
      tracking-modes: cookie
      cookie:
        # The browser does not send the session cookie on requests started by other sites,
        # except when the visitor follows a link to this site.
        same-site: lax

app:
  auth:
    # The site's administrator. Leave both empty to run without one (read-only site).
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    # More administrators, when one is not enough: username:password pairs separated by
    # commas. They follow the same rules, and one that is removed here loses the role.
    additional-admins: ${ADDITIONAL_ADMINS:}
    # Set REGISTRATION_ENABLED=false to stop visitors from creating accounts.
    registration-enabled: ${REGISTRATION_ENABLED:true}

  flight-lookup:
    # How long to wait for the lookup service before answering 502.
    timeout: ${FLIGHT_LOOKUP_TIMEOUT:8s}
    adsbdb:
      # The free service used when no AeroDataBox key is set. It knows routes
      # and airlines, not aircraft types, and it accepts any date.
      base-url: ${ADSBDB_BASE_URL:https://api.adsbdb.com}
    aerodatabox:
      # With a key, AeroDataBox is asked first: it also knows aircraft types,
      # but only for dates within a year of today, and it spends the key's
      # quota. Whenever it has no answer, ADSBDB is asked instead.
      api-key: ${AERODATABOX_API_KEY:}
      base-url: ${AERODATABOX_BASE_URL:https://aerodatabox.p.rapidapi.com}
      # x-rapidapi-key for RapidAPI, X-Api-Key for a direct subscription.
      api-key-header: ${AERODATABOX_API_KEY_HEADER:x-rapidapi-key}
