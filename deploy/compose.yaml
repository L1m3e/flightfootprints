# The whole site on one server: the application, its database, and Caddy in front.
#
#   cd deploy
#   cp .env.example .env        # then fill it in
#   docker compose up -d --build
#
# docs/deployment.md walks through it step by step. For development use the
# compose.yaml in the repository root instead; it only starts a database.
name: flightfootprints-site

services:
  # The only service that is reachable from outside. It answers visitors, takes care of
  # the HTTPS certificate when SITE_ADDRESS is a domain name, and passes requests on.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means asking for new ones, and the
      # certificate authority only hands out a few per week.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  # Spring Boot with the built frontend inside: see the Dockerfile in the repository root.
  app:
    build:
      context: ..
    image: flightfootprints
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flightfootprints
      SPRING_DATASOURCE_USERNAME: flightfootprints
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      # A ceiling for Java's memory, so that the database keeps its share on a small server.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx320m}
    # Its health check is part of the image.
    depends_on:
      postgres:
        condition: service_healthy

  # No ports: only the application can reach the database, over the Compose network.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flightfootprints
      POSTGRES_USER: flightfootprints
      # Only used when the database is created. See docs/deployment.md for changing it later.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Every flight is in this volume. PostgreSQL 18+ images keep their data in
      # /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightfootprints -d flightfootprints"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
